name: Endurance Advanced Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: endurance-advanced-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout advanced Endurance
        uses: actions/checkout@v4
        with:
          ref: feat/guided-ux-playstore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Export advanced Endurance web
        run: npx expo export --platform web
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy advanced Endurance
        id: deployment
        uses: actions/deploy-pages@v4
