name: Endurance Static Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout advanced Endurance
        uses: actions/checkout@v4
        with:
          ref: feat/guided-ux-playstore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo export --platform web
      - name: Publish static preview
        run: npx gh-pages -d dist -b gh-pages -u "github-actions-bot <support+actions@github.com>" -r "https://x-access-token:${GH_TOKEN}@github.com/SkyareCom/stackup.holdem-endurance.git"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}



