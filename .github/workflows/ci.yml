name: Endurance CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test suite
        run: npm test

      - name: Typography validation
        run: node scripts/check-typography.mjs

      - name: i18n validation
        run: node scripts/check-i18n.mjs

      - name: Guided UX validation
        run: node scripts/check-guided-ux.mjs

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Web export validation
        run: npx expo export --platform web
