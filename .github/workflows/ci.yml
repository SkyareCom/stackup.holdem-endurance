name: Endurance CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Expo dependency diagnostics
        run: npx expo-doctor@latest

      - name: Test suite
        run: npm test

      - name: Typography validation
        run: node scripts/check-typography.mjs

      - name: i18n validation
        run: node scripts/check-i18n.mjs

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Android release configuration
        run: node scripts/check-android-release.cjs

      - name: Android export validation
        run: npx expo export --platform android

      - name: Web export validation
        run: npx expo export --platform web
